[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-first"
version = "0.1.0"
description = "OpenAI-compatible proxy that runs what it can on your own machine, never falls back silently, and shows what you saved."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["local-llm", "lm-studio", "ollama", "openai-proxy", "llm-router", "cost"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License",
               "Topic :: Scientific/Engineering :: Artificial Intelligence"]
dependencies = []

[project.scripts]
local-first = "localfirst:main"

[project.urls]
Homepage = "https://github.com/JohnSUNLei/hands-off/tree/main/local-first"

[tool.setuptools]
py-modules = ["localfirst"]
