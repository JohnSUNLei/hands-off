[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "send-fuse"
version = "0.1.0"
description = "A fuse between your AI agent and the Send button: blocks sends a careful human wouldn't make."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["ai-agents", "claude-code", "hooks", "email", "guardrails", "llm-safety"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License",
               "Topic :: Communications :: Email"]
dependencies = []

[project.scripts]
send-fuse = "sendfuse:main"

[project.urls]
Homepage = "https://github.com/JohnSUNLei/hands-off/tree/main/send-fuse"

[tool.setuptools]
py-modules = ["sendfuse"]
