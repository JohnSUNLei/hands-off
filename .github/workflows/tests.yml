name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          # 3.9 is end-of-life and no longer on the latest Ubuntu runners; keep checking it on macOS
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: git identity for tests that build throwaway repos
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - run: python run_tests.py
